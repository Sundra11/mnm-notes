<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="திருவருட்பயன் — Thiruvarutpayan notes" />
  <title>திருவருட்பயன் | Thiruvarutpayan</title>

  <style>
    :root {
      --bg: #f7f3eb;
      --paper: rgba(255, 252, 246, 0.88);
      --ink: #28231e;
      --muted: #766e64;
      --accent: #8a5a2b;
      --accent-dark: #5f3d1d;
      --line: #ded5c8;
      --soft: #eee6d9;
      --shadow: 0 18px 50px rgba(65, 45, 25, 0.10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(170, 126, 71, 0.10), transparent 28%),
        radial-gradient(circle at 85% 25%, rgba(138, 90, 43, 0.08), transparent 30%),
        var(--bg);
      font-family: Georgia, "Noto Serif Tamil", "Nirmala UI", serif;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 70px 0 55px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    h1 {
      margin: 18px 0 4px;
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    .english-title {
      margin: 0;
      color: var(--accent);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .intro {
      max-width: 650px;
      margin: 25px auto 0;
      color: var(--muted);
      font-size: 17px;
    }

    .ornament {
      width: 70px;
      height: 1px;
      margin: 28px auto 0;
      background: var(--line);
      position: relative;
    }

    .ornament::after {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 0 10px;
      background: var(--bg);
      color: var(--accent);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin: 20px 0 28px;
    }

    .section-title {
      margin: 0;
      font-size: 26px;
      font-weight: 500;
    }

    .search {
      width: min(300px, 100%);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.55);
      border-radius: 999px;
      padding: 11px 17px;
      outline: none;
      color: var(--ink);
      font: 14px "Segoe UI", Arial, sans-serif;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(138,90,43,.10);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding-bottom: 70px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 180px;
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 7px 25px rgba(65, 45, 25, 0.05);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      right: -30px;
      bottom: -45px;
      width: 130px;
      height: 130px;
      border: 1px solid rgba(138,90,43,.10);
      border-radius: 50%;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(138,90,43,.45);
      box-shadow: var(--shadow);
    }

    .day {
      color: var(--accent);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 9px 0 8px;
      font-size: 25px;
      font-weight: 500;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .arrow {
      position: absolute;
      left: 25px;
      bottom: 20px;
      color: var(--accent);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
    }

    .empty {
      display: none;
      grid-column: 1 / -1;
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      padding: 25px 0 45px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .days { grid-template-columns: repeat(2, 1fr); }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .search { width: 100%; }
    }

    @media (max-width: 520px) {
      .container { width: min(100% - 28px, 1120px); }
      header { padding: 50px 0 40px; }
      .days { grid-template-columns: 1fr; }
      h1 { font-size: 45px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="eyebrow">Notes &amp; Reflections</div>
      <h1>திருவருட்பயன்</h1>
      <p class="english-title">Thiruvarutpayan</p>
      <p class="intro">
        தினந்தோறும் கற்றவற்றையும் சிந்தனைகளையும் தொகுத்து வைத்திருக்கும் குறிப்புகள்.
      </p>
      <div class="ornament"></div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <h2 class="section-title">பாடக் குறிப்புகள்</h2>
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search days..."
        aria-label="Search notes"
      />
    </div>

    <section id="days" class="days">
      <!-- Add more days by copying a card and changing the href/title. -->
      <a class="card" data-search="day 1 நாள் 1" href="./day-1/">
        <div class="day">Day 01</div>
        <h3>நாள் 1</h3>
        <p>முதல் நாள் குறிப்புகள் மற்றும் சிந்தனைகள்.</p>
        <span class="arrow">Open notes →</span>
      </a>

      <!-- <a class="card" data-search="day 2 நாள் 2" href="./day-2/">
        <div class="day">Day 02</div>
        <h3>நாள் 2</h3>
        <p>இரண்டாம் நாள் குறிப்புகள் மற்றும் சிந்தனைகள்.</p>
        <span class="arrow">Open notes →</span>
      </a>

      <a class="card" data-search="day 3 நாள் 3" href="./day-3/">
        <div class="day">Day 03</div>
        <h3>நாள் 3</h3>
        <p>மூன்றாம் நாள் குறிப்புகள் மற்றும் சிந்தனைகள்.</p>
        <span class="arrow">Open notes →</span>
      </a> -->

      <div id="empty" class="empty">No matching notes found.</div>
    </section>
  </main>

  <footer>
    <div class="container">
      திருவருட்பயன் · Thiruvarutpayan
    </div>
  </footer>

  <script>
    const search = document.getElementById("search");
    const cards = [...document.querySelectorAll(".card")];
    const empty = document.getElementById("empty");

    search.addEventListener("input", () => {
      const query = search.value.trim().toLowerCase();
      let visible = 0;

      cards.forEach(card => {
        const match = card.dataset.search.toLowerCase().includes(query);
        card.style.display = match ? "" : "none";
        if (match) visible++;
      });

      empty.style.display = visible ? "none" : "block";
    });
  </script>
</body>
</html>
